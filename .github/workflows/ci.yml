name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  circuits:
    name: Circom Circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SnarkJS & Dependencies
        run: |
          npm install -g snarkjs
          cd circuits && npm install

      - name: Install Circom
        run: |
          curl -sSL -o /usr/local/bin/circom https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Compile Circuit
        run: |
          cd circuits
          chmod +x ./scripts/compile.sh
          bash ./scripts/compile.sh

      - name: Run Circuit Tests
        run: |
          cd circuits
          npm test

      # Guard the upload below. `if-no-files-found` is not enough on its own:
      # it fires only when NO path matches, so with four paths listed and
      # three of them valid, a mistyped fourth is a warning at most and the
      # job stays green while shipping an incomplete artifact. That is
      # precisely how `vkey.json` — a file compile.sh has never produced,
      # since it names the key `${CIRCUIT}_vkey.json` — went unnoticed.
      # Checking each path explicitly is what actually fails the build.
      - name: Verify Circuit Artifacts Exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            circuits/build/vote_js/vote.wasm \
            circuits/build/vote_final.zkey \
            circuits/build/vote_vkey.json \
            circuits/build/test_proof.json
          do
            if [ -s "$f" ]; then
              echo "ok      $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Expected circuit build outputs are missing or empty."
            echo "Contents of circuits/build:"
            ls -la circuits/build || true
            exit 1
          fi

      - name: Upload Circuit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: circuit-artifacts
          path: |
            circuits/build/vote_js/vote.wasm
            circuits/build/vote_final.zkey
            circuits/build/vote_vkey.json
            circuits/build/test_proof.json
          if-no-files-found: error

  contracts:
    name: Solidity Contracts
    runs-on: ubuntu-latest
    needs: circuits
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Download Circuit Artifacts
        uses: actions/download-artifact@v4
        with:
          name: circuit-artifacts
          path: circuits/build

      - name: Copy Generated Verifier Contract
        run: |
          mkdir -p contracts/src/verifier
          npx snarkjs zkey export solidityverifier circuits/build/vote_final.zkey contracts/src/verifier/Groth16Verifier.sol

      - name: Compile Contracts
        run: |
          cd contracts
          forge build

      - name: Run Contract Tests
        run: |
          cd contracts
          forge test -vvv

  relayer:
    name: Rust Relayer Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Relayer Service
        run: cargo check -p viche-relayer

      - name: Run Relayer Unit Tests
        run: cargo test -p viche-relayer

  frontend:
    name: WASM & Rust Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace

      - name: Build WASM Frontend Release
        run: wasm-pack build --release crates/viche-frontend

      # `test_support.rs` declares `wasm_bindgen_test_configure!(run_in_browser)`
      # crate-wide (several tests mock `window.ethereum` / mount components
      # into a real DOM), so the whole suite needs a browser, not Node.
      # ubuntu-latest ships Chrome preinstalled; wasm-pack fetches a matching
      # chromedriver automatically.
      - name: Run WASM Frontend Tests
        run: wasm-pack test --headless --chrome crates/viche-frontend
