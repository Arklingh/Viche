version: '3.8'

services:
  anvil:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: viche-anvil
    command: anvil --host 0.0.0.0 --port 8545
    ports:
      - "8545:8545"
    restart: unless-stopped

  relayer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: viche-relayer
    environment:
      - RPC_URL=http://anvil:8545
      - VOTING_MANAGER_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - RELAYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - LISTEN_ADDR=0.0.0.0:3000
    volumes:
      - .:/app
    command: cargo run -p viche-relayer
    ports:
      - "3000:3000"
    depends_on:
      - anvil
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: viche-frontend
    volumes:
      - .:/app
    command: bash -c "cd crates/viche-frontend && trunk serve --address 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    depends_on:
      - relayer
    restart: unless-stopped
