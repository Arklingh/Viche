<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viche - Anonymous Voting</title>

    <!-- =====================================================================
         Content-Security-Policy.

         This page runs the code that sees the voter's `secret` in cleartext:
         circomlibjs derives the Poseidon commitment from it and snarkjs
         consumes it during witness generation. Anything that can inject a
         script here can exfiltrate that secret, which breaks ballot anonymity
         AND lets the attacker forge a valid vote for every registered voter.
         So the policy is `default-src 'self'` with the smallest set of
         additions that the app actually needs. Each one is justified below.

         `frame-ancestors`, `report-uri` and `sandbox` are ignored when a CSP
         is delivered via <meta> (per spec), so they are NOT listed here — they
         are in the reverse-proxy header set documented in
         docs/deployment.md §4.5, which is the stronger place to enforce all of
         this anyway. Ship both.

         __VICHE_CSP_CONNECT_SRC__ below is a placeholder substituted at build
         time by tools/postbuild.mjs from $VICHE_CSP_CONNECT_SRC, so a single
         deployment's relayer origin is never hardcoded into the repo.

           script-src 'wasm-unsafe-eval'
               Required on Chromium for *any* WebAssembly.compile /
               .instantiate from bytes. Three separate things need it: the
               Leptos app's own wasm-bindgen module, the Poseidon wasm that
               circomlibjs builds at runtime, and snarkjs's Groth16 prover.
               Note this is NOT 'unsafe-eval' — JS eval()/new Function() stay
               blocked.
           worker-src / child-src blob:
               snarkjs parallelises BN254 arithmetic across web workers that it
               constructs from `URL.createObjectURL(new Blob([...]))`. 'self'
               covers public/zk_worker.js; blob: covers snarkjs's own pool.
           connect-src blob:
               public/asset_cache.js hands proofgen.rs a blob: URL for the
               cached vote.wasm / vote_final.zkey, and snarkjs fetch()es it.
           style-src 'unsafe-inline'
               One inline style attribute remains in the app
               (components/poll_detail.rs sets the results bar width via
               `style=format!("width: {}%", pct)`). Inline style *attributes*
               need 'unsafe-inline' under style-src. This is the one directive
               that is looser than it should be; it is a styling-only surface,
               and it tightens to `style-src 'self'` the moment that attribute
               becomes a CSS custom property.
           img-src data:
               inline SVG/data-URI icons in the markup.

         The wallet (MetaMask and other EIP-1193 providers) is injected by a
         browser extension content script, which runs in an isolated world and
         is exempt from the page's CSP — confirmed against this policy, see
         docs/deployment.md §4.5.
         ===================================================================== -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; connect-src 'self' blob:__VICHE_CSP_CONNECT_SRC__"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />

    <!-- data-wasm-opt-params: current rustc emits bulk-memory ops and
         saturating float-to-int casts by default on wasm32 (both stable
         features); wasm-opt rejects them unless explicitly allowed, even
         though it only needs to pass them through unchanged. Without this,
         `trunk build --release` fails wasm-opt validation. -->
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"
    />
    <!-- data-target-path="/": without it, Trunk copies public/'s contents
         to dist/public/ (preserving the source dir name), not dist/'s root.
         Everything that references these assets — this file's own
         `<script src="asset_cache.js">` below, the `/vendor/snarkjs.min.js`
         importScripts in public/zk_worker.js, and the circuit wasm/zkey
         URLs in actions.rs — expects them at the site root
         (/asset_cache.js, /vendor/*.js, /circuits/vote.wasm), so without this
         they 404 (silently, as an HTML fallback page — no visible error until
         something tries to WebAssembly.compile() the HTML it got back). -->
    <link data-trunk rel="copy-dir" href="public" data-target-path="/" />

    <!-- Tailwind, pre-built. This replaces the `cdn.tailwindcss.com` play CDN
         (a runtime JIT compiler that Tailwind documents as not-for-production,
         and which cannot coexist with a strict CSP) plus its inline
         `tailwind.config` block. The brand palette moved verbatim into
         tailwind.config.js; the shimmer keyframes moved into styles/app.css.
         The generated file is a build artifact, regenerated on every
         `trunk build` / `trunk serve` by the pre_build hook in Trunk.toml, so
         it cannot drift from the markup. -->
    <link data-trunk rel="css" href="styles/tailwind.generated.css" />

    <!-- Per-deployment runtime overrides (relayer URL, chain id, contract
         address). Empty by default; see docs/deployment.md §4.3. This is a
         file rather than an inline <script> because the CSP above forbids
         inline scripts — an operator pasting a <script> block into index.html
         would find it silently refused. Must come first: src/config.rs reads
         these globals as soon as the wasm boots. -->
    <script src="viche_env.js"></script>

    <!-- The ZK stack, served same-origin from this app's own bundle.
         Provenance + SHA-256 of every byte: public/vendor/VENDOR.md.
         These were `https://cdn.jsdelivr.net/...` script tags with no
         Subresource Integrity; see VENDOR.md for why that was the single most
         dangerous thing in the frontend. Classic scripts, so they execute in
         document order and are ready before viche_boot.js runs. -->
    <script src="vendor/snarkjs.min.js"></script>
    <script src="vendor/circomlibjs-poseidon.js"></script>

    <!-- Cache Storage warm-up for the ~7MB circuit artifacts. -->
    <script src="asset_cache.js"></script>

    <!-- Builds the Poseidon instance and publishes the window globals that
         src/crypto.rs and src/actions.rs read. Lives in its own file rather
         than inline so script-src can stay 'self' with no 'unsafe-inline'. -->
    <script src="viche_boot.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Leptos mounts its root component into <body> via mount_to_body. -->
  </body>
</html>
