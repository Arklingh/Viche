[package]
name = "viche-relayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Gasless ZK voting relayer (Axum + alloy)."

[[bin]]
name = "viche-relayer"
path = "src/main.rs"

[dependencies]
viche-core = { path = "../viche-core" }

# Alloy types pulled directly so the sol!-generated binding has matching
# primitive/sol-types versions with the alloy umbrella crate.
alloy.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true

axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true

# Used to decode the hex private key in config.rs.
hex = "0.4"
url = "2"

[dev-dependencies]
# Only needed to construct a synthetic ErrorPayload in relay.rs's tests
# (simulating what a reverted eth_call looks like on the wire, without a
# live node). alloy_transport/alloy_contract already depend on this
# transitively; pinned to match the workspace's alloy 0.3.6 resolution.
alloy-json-rpc = "0.3.6"

[lints.rust]
unused = "allow"
